<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<table border="2" cellpadding="10" cellspacing="0" style="border-collapse: collapse; font-family: 'Times New Roman', Times, serif; font-size: 16px;">
    <tr>
        <td rowspan="2" style="text-align: left; padding: 25px 40px;"><b>State of Health</b></td>
        <td colspan="2" style="text-align: center; padding: 25px 40px;"><b>Fasting Value</b></td>
        <td style="text-align: center; padding: 25px 40px;"><b>After Eating</b></td>
    </tr>
    <tr>
        <td style="text-align: center; padding: 25px 40px;"><b>Minimum</b></td>
        <td style="text-align: center; padding: 25px 40px;"><b>Maximum</b></td>
        <td style="text-align: center; padding: 25px 40px;"><b>2 hours after eating</b></td>
    </tr>
    <tr>
        <td style="text-align: left; padding: 25px 40px;">Healthy</td>
        <td style="text-align: center; padding: 25px 40px;">70</td>
        <td style="text-align: center; padding: 25px 40px;">100</td>
        <td style="text-align: center; padding: 25px 40px;">Less than 140</td>
    </tr>
    <tr>
        <td style="text-align: left; padding: 25px 40px;">Pre-Diabetes</td>
        <td style="text-align: center; padding: 25px 40px;">101</td>
        <td style="text-align: center; padding: 25px 40px;">126</td>
        <td style="text-align: center; padding: 25px 40px;">140 to 200</td>
    </tr>
    <tr>
        <td style="text-align: left; padding: 25px 40px;">Diabetes</td>
        <td style="text-align: center; padding: 25px 40px;">More than 126</td>
        <td style="text-align: center; padding: 25px 40px;">N/A</td>
        <td style="text-align: center; padding: 25px 40px;">More than 200</td>
    </tr>
</table>
</body>
</html>
