<!DOCTYPE html>
<html>
<head>
    <title>Health Chart</title>
</head>
<body>

<h2>Health Chart</h2>

<table border="3" cellpadding="10" cellspacing="0">

    <tr>
        <th rowspan="2">State of Health</th>
        <th colspan="2">Fasting Value</th>
        <th rowspan="2">After Eating</th>
        
    </tr>

    <tr>
        <th>Minimum</th>
        <th>Maximum</th>
    </tr>

    <tr>
        <td>Healthy</td>
        <td>70</td>
        <td>100</td>
        <td>Less than 140</td>
    </tr>

    <tr>
        <td>Pre-Diabetes</td>
        <td>101</td>
        <td>126</td>
        <td>140 to 200</td>
    </tr>

    <tr>
        <td>Diabetes</td>
        <td>More than 126</td>
        <td>N/A</td>
        <td>More than 200</td>
    </tr>
</table>


</body>
</html>
