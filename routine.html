<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="3" cellpadding="8" cellspacing="0">
    <tr>
        <td colspan="6" align="center"><b>Athletics day time table</b></td>
    </tr>
    <tr>
        <td align="center"><b>Area</b></td>
        <td align="center"><b>10am-11am</b></td>
        <td align="center"><b>11am-12pm</b></td>
        <td align="center"><b>12pm-1pm</b></td>
        <td align="center"><b>1pm-2pm</b></td>
        <td align="center"><b>2pm-3pm</b></td>
    </tr>
    <tr>
        <td rowspan="2" align="center"><b>Track</b></td>
        <td align="center">400m</td>
        <td align="center">200m</td>
        <td rowspan="3" align="center"><b>Lunch</b></td>
        <td align="center">800m</td>
        <td align="center">100m</td>
    </tr>
    <tr>
        <td align="center">Hurdles</td>
        <td align="center">1500m</td>
        <td align="center">Free</td>
        <td align="center">80m</td>
    </tr>
    <tr>
        <td align="center"><b>Field</b></td>
        <td align="center">Discus</td>
        <td align="center">Javelin</td>
        <td align="center">Shot put</td>
        <td align="center">Hammer throw</td>
    </tr>
</table>

</body>
</html>
