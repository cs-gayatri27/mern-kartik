<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletics Day Time Table</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            border: 8px solid #333;
            padding: 10px;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .table-wrapper {
            border: 3px solid #333;
            padding: 0;
        }
        
        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 32px;
            font-weight: bold;
            background-color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        
        th, td {
            border: 2px solid #333;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        
        th {
            background-color: white;
        }
        
        .area-cell {
            font-size: 24px;
        }
        
        .lunch-cell {
            font-weight: bold;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="table-wrapper">
            <h3>Athletics Day Time Table</h3>
            <table>
                <thead>
                    <tr>
                        <th class="area-cell">Area</th>
                        <th>10 am-11am</th>
                        <th>11am-12pm</th>
                        <th>12pm-1pm</th>
                        <th>1pm-2pm</th>
                        <th>2pm-3pm</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="cell" rowspan="2">Track</td>
                        <td>400m</td>
                        <td>200m</td>
                        <td rowspan="3" class="cell">Lunch</td>
                        <td>800m</td>
                        <td>100m</td>
                    </tr>
                    <tr>
                        <td>Hurdles</td>
                        <td>1500m</td>
                        <td>Free</td>
                        <td>80m</td>
                    </tr>
                    <tr>
                        <td class="cell">Field</td>
                        <td>Discus</td>
                        <td>Javelin</td>
                        <td>Shot put</td>
                        <td>Hammer throw</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
